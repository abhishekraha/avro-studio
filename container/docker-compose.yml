version: '3.8'

services:
  avro-studio:
    build:
      context: ..
      dockerfile: Dockerfile
    image: avro-studio:1.0.0
    ports:
      - "3000:3000"
    volumes:
      - avro-data:/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AVRO_DATA_DIR=/data
    restart: unless-stopped

volumes:
  avro-data:
    driver: local